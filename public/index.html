<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual Calling Panel (Bridge & Browser)</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; }
        .tab-buttons { display: flex; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; cursor: pointer; border: none; background: #ddd; font-weight: bold; }
        .tab-btn.active { background: #007bff; color: #white; }
        .form-section { display: none; }
        .form-section.active { display: block; }
        label { display: block; margin-top: 10px; font-size: 14px; color: #555; }
        input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button.submit-btn { width: 100%; margin-top: 15px; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button.submit-btn:hover { background: #218838; }
        #response-msg { margin-top: 15px; text-align: center; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Twilio Dual Calling</h2>
    
    <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchTab('bridge')">1. Bridge Method</button>
        <button class="tab-btn" onclick="switchTab('browser')">2. Browser Call</button>
    </div>

    <!-- Option 1 Form: Bridge Method -->
    <div id="bridge-section" class="form-section active">
        <h3>Bridge Calling (Via Active Phone)</h3>
        <label>Your Active Phone Number (Jahan pehle call aayegi):</label>
        <input type="text" id="bridgeYourNum" placeholder="+91XXXXXXXXXX">
        
        <label>Target Number (Jisse baat karni hai):</label>
        <input type="text" id="bridgeTargetNum" placeholder="+91XXXXXXXXXX">
        
        <button class="submit-btn" onclick="startBridgeCall()">Start Bridge Call</button>
    </div>

    <!-- Option 2 Form: Browser WebRTC Method -->
    <div id="browser-section" class="form-section">
        <h3>Direct Browser Call (No SIM Needed)</h3>
        <label>Target Number (Jisse baat karni hai):</label>
        <input type="text" id="browserTargetNum" placeholder="+91XXXXXXXXXX">
        
        <button class="submit-btn" onclick="startBrowserCall()">Start Browser Call</button>
    </div>

    <div id="response-msg"></div>
</div>

<script>
    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));

        if(tab === 'bridge') {
            document.querySelector('.tab-buttons button:nth-child(1)').classList.add('active');
            document.getElementById('bridge-section').classList.add('active');
        } else {
            document.querySelector('.tab-buttons button:nth-child(2)').classList.add('active');
            document.getElementById('browser-section').classList.add('active');
        }
        document.getElementById('response-msg').innerText = '';
    }

    async function startBridgeCall() {
        const yourActiveNumber = document.getElementById('bridgeYourNum').value;
        const targetNumber = document.getElementById('bridgeTargetNum').value;
        const msgDiv = document.getElementById('response-msg');

        msgDiv.style.color = '#333';
        msgDiv.innerText = 'Initiating Bridge Call...';

        try {
            const res = await fetch('/api/bridge-call', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ yourActiveNumber, targetNumber })
            });
            const data = await res.json();
            if(data.success) {
                msgDiv.style.color = 'green';
                msgDiv.innerText = 'Success! Check your active phone.';
            } else {
                msgDiv.style.color = 'red';
                msgDiv.innerText = 'Error: ' + data.error;
            }
        } catch(err) {
            msgDiv.style.color = 'red';
            msgDiv.innerText = 'Request Failed!';
        }
    }

    async function startBrowserCall() {
        const targetNumber = document.getElementById('browserTargetNum').value;
        const msgDiv = document.getElementById('response-msg');

        msgDiv.style.color = '#333';
        msgDiv.innerText = 'Connecting Browser Call...';

        try {
            const res = await fetch('/api/browser-call', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ targetNumber })
            });
            const data = await res.json();
            if(data.success) {
                msgDiv.style.color = 'green';
                msgDiv.innerText = 'Success! Browser call triggered.';
            } else {
                msgDiv.style.color = 'red';
                msgDiv.innerText = 'Error: ' + data.error;
            }
        } catch(err) {
            msgDiv.style.color = 'red';
            msgDiv.innerText = 'Request Failed!';
        }
    }
</script>

</body>
</html>
