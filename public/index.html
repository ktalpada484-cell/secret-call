<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Call - Private Portal</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body {
            background-color: #050b07; color: #00ff66; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(circle at 50% 20%, rgba(0, 255, 102, 0.08) 0%, transparent 50%);
        }
        .container { width: 100%; max-width: 420px; padding: 20px; }
        .glass-card {
            background: rgba(10, 25, 15, 0.75); backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 102, 0.2); border-radius: 24px; padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 255, 102, 0.1);
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #ffffff; font-size: 22px; font-weight: 700; }
        .header p { color: #00cc55; font-size: 12px; margin-top: 4px; }

        .method-selector {
            display: flex; background: rgba(0, 20, 10, 0.8);
            border: 1px solid rgba(0, 255, 102, 0.3); border-radius: 12px; padding: 4px; margin-bottom: 20px;
        }
        .method-btn {
            flex: 1; padding: 10px 5px; background: transparent; border: none;
            color: #88bb99; font-size: 11px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.3s ease;
        }
        .method-btn.active { background: rgba(0, 255, 102, 0.2); color: #00ff66; box-shadow: 0 0 10px rgba(0, 255, 102, 0.2); }

        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; color: #88bb99; font-size: 11px; text-transform: uppercase; margin-bottom: 6px; }
        .input-wrapper { display: flex; }
        .country-select {
            background: rgba(0, 20, 10, 0.8); border: 1px solid rgba(0, 255, 102, 0.3);
            color: #00ff66; padding: 12px; border-radius: 12px 0 0 12px; outline: none; border-right: none;
        }
        .phone-input, .text-input, .effect-select {
            width: 100%; background: rgba(0, 20, 10, 0.8); border: 1px solid rgba(0, 255, 102, 0.3);
            color: #ffffff; padding: 12px 15px; font-size: 15px; outline: none; border-radius: 12px;
        }
        .phone-input { border-radius: 0 12px 12px 0; }

        .glass-btn {
            width: 100%; background: rgba(0, 255, 102, 0.15); border: 1px solid rgba(0, 255, 102, 0.5);
            color: #ffffff; padding: 15px; font-size: 15px; font-weight: 600; border-radius: 14px;
            cursor: pointer; transition: all 0.3s ease; margin-top: 10px;
        }
        .glass-btn:hover { background: rgba(0, 255, 102, 0.3); box-shadow: 0 0 20px rgba(0, 255, 102, 0.4); }

        .error-msg { color: #ff4444; font-size: 12px; text-align: center; margin-top: 10px; display: none; }

        /* MODAL & CALL CONTROLS */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 8, 4, 0.98); display: flex; justify-content: center; align-items: center;
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .call-screen { text-align: center; width: 100%; max-width: 360px; padding: 20px; }
        
        .avatar-glow {
            width: 90px; height: 90px; border-radius: 50%; background: rgba(0, 255, 102, 0.1);
            border: 2px solid #00ff66; display: flex; justify-content: center; align-items: center;
            margin: 0 auto 15px auto; font-size: 36px; animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 102, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(0, 255, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 102, 0); }
        }

        .timer { font-size: 14px; color: #88bb99; margin-top: 5px; }

        /* CALL CONTROLS (MUTE, SPEAKER) */
        .controls-row {
            display: flex; justify-content: center; gap: 20px; margin-top: 25px;
        }
        .ctrl-btn {
            width: 55px; height: 55px; border-radius: 50%;
            background: rgba(0, 255, 102, 0.1); border: 1px solid rgba(0, 255, 102, 0.4);
            color: #00ff66; font-size: 20px; cursor: pointer; display: flex;
            justify-content: center; align-items: center; transition: all 0.3s ease;
        }
        .ctrl-btn.active {
            background: rgba(255, 68, 68, 0.2); border-color: #ff4444; color: #ff4444;
        }

        .end-btn {
            background: rgba(255, 50, 50, 0.2); border: 1px solid #ff4444; color: #ff4444;
            width: 65px; height: 65px; border-radius: 50%; font-size: 24px; cursor: pointer;
            margin: 25px auto 0 auto; display: flex; justify-content: center; align-items: center;
        }
        .end-btn:hover { background: rgba(255, 50, 50, 0.6); box-shadow: 0 0 20px rgba(255, 68, 68, 0.6); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div class="container" id="loginScreen">
        <div class="glass-card">
            <div class="header">
                <h1>SECRET CALL</h1>
                <p>Private Calling Portal</p>
            </div>
            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" class="text-input" placeholder="Enter username" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" class="text-input" placeholder="Enter password" required>
                </div>
                <button type="submit" class="glass-btn">🔓 Login</button>
                <div id="loginError" class="error-msg">Invalid Credentials!</div>
            </form>
        </div>
    </div>

    <!-- MAIN DIALER SCREEN -->
    <div class="container hidden" id="dialerScreen">
        <div class="glass-card">
            <div class="header">
                <h1>SECRET CALL</h1>
                <p>Caller ID Masking Active</p>
            </div>

            <div class="method-selector">
                <button class="method-btn active" id="btnBrowser" onclick="switchMode('browser')">🌐 Browser Mode (Wi-Fi)</button>
                <button class="method-btn" id="btnBridge" onclick="switchMode('bridge')">📞 Bridge Mode (SIM)</button>
            </div>

            <div class="input-group hidden" id="yourPhoneGroup">
                <label>Your Active Phone Number</label>
                <div class="input-wrapper">
                    <select class="country-select" id="myCountryCode">
                        <option value="+91" selected>🇮🇳 +91</option>
                    </select>
                    <input type="tel" id="myNumber" class="phone-input" placeholder="Active Mobile Number" maxlength="10">
                </div>
            </div>

            <div class="input-group">
                <label>Target Phone Number</label>
                <div class="input-wrapper">
                    <select class="country-select" id="targetCountryCode">
                        <option value="+91" selected>🇮🇳 +91</option>
                    </select>
                    <input type="tel" id="targetNumber" class="phone-input" placeholder="Target Number" maxlength="10">
                </div>
            </div>

            <!-- VOICE EFFECT SELECTOR -->
            <div class="input-group">
                <label>Voice Effect</label>
                <select id="voiceEffect" class="effect-select">
                    <option value="normal">🎙️ Normal Voice</option>
                    <option value="deep">🤖 Deep Male Pitch</option>
                    <option value="high">🐿️ High Pitch / Female</option>
                </select>
            </div>

            <button class="glass-btn" onclick="initiateSecretCall()">🛡️ Connect Secret Call</button>
            <div id="dialerError" class="error-msg">Sahi 10-Digit Mobile Numbers Enter Karein!</div>
        </div>
    </div>

    <!-- CALL INTERFACE MODAL WITH MUTE & SPEAKER -->
    <div class="modal-overlay" id="callModal">
        <div class="call-screen">
            <div class="avatar-glow">📞</div>
            <h2 style="color:#fff;" id="targetDisplayNum">+91 93164XXXXX</h2>
            <div class="timer" id="callTimer">00:00</div>
            <p style="color:#00ff66; margin-top:8px; font-size:12px;" id="callStatusText">Connecting...</p>

            <!-- CONTROLS: MUTE & SPEAKER -->
            <div class="controls-row">
                <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()" title="Mute/Unmute">🎙️</button>
                <button class="ctrl-btn" id="speakerBtn" onclick="toggleSpeaker()" title="Speaker On/Off">🔊</button>
            </div>

            <button class="end-btn" onclick="endCall()">✕</button>
        </div>
    </div>

    <script>
        const VALID_USER = "sumit@1123";
        const VALID_PASS = "manali@11230";
        let currentMode = 'browser';
        let timerInterval = null;
        let secondsElapsed = 0;
        let device = null;
        let activeCall = null;
        let isMuted = false;

        function loadTwilioSDK() {
            return new Promise((resolve, reject) => {
                if (window.Twilio) return resolve(true);

                const script = document.createElement('script');
                script.src = "https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2.10.1/dist/twilio-voice.min.js";
                script.onload = () => resolve(true);
                script.onerror = () => {
                    const fallbackScript = document.createElement('script');
                    fallbackScript.src = "https://cdnjs.cloudflare.com/ajax/libs/twilio-client/1.14.0/twilio.min.js";
                    fallbackScript.onload = () => resolve(true);
                    fallbackScript.onerror = () => reject(new Error("SDK Load Failed"));
                    document.head.appendChild(fallbackScript);
                };
                document.head.appendChild(script);
            });
        }

        async function requestMicPermission() {
            try {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    stream.getTracks().forEach(track => track.stop());
                }
            } catch (err) {
                console.warn("Mic Error:", err);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            requestMicPermission();
            loadTwilioSDK().catch(e => console.log("SDK Preload Pending"));
        });

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            if (u === VALID_USER && p === VALID_PASS) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dialerScreen').classList.remove('hidden');
                requestMicPermission();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btnBridge').classList.toggle('active', mode === 'bridge');
            document.getElementById('btnBrowser').classList.toggle('active', mode === 'browser');
            document.getElementById('yourPhoneGroup').classList.toggle('hidden', mode === 'browser');
        }

        async function initiateSecretCall() {
            const targetCode = document.getElementById('targetCountryCode').value;
            const targetNum = document.getElementById('targetNumber').value.trim();
            const errorDiv = document.getElementById('dialerError');

            if (targetNum.length < 10) {
                errorDiv.innerText = "Target ka 10-digit number daalein!";
                errorDiv.style.display = 'block';
                return;
            }

            errorDiv.style.display = 'none';
            document.getElementById('targetDisplayNum').innerText = targetCode + " " + targetNum;
            document.getElementById('callModal').classList.add('active');
            document.getElementById('callStatusText').innerText = "Connecting Browser Call...";
            startTimer();

            if (currentMode === 'browser') {
                try {
                    await loadTwilioSDK();

                    const res = await fetch('/api/token');
                    const data = await res.json();

                    if (!data.success) {
                        document.getElementById('callStatusText').innerText = "Token Error: " + data.error;
                        return;
                    }

                    if (window.Twilio && Twilio.Voice) {
                        device = new Twilio.Voice.Device(data.token, { debug: true });

                        device.on('registered', async () => {
                            document.getElementById('callStatusText').innerText = "Ringing Target Number...";
                            try {
                                activeCall = await device.connect({ params: { To: targetCode + targetNum } });
                                activeCall.on('accept', () => document.getElementById('callStatusText').innerText = "Call Connected!");
                                activeCall.on('disconnect', () => endCall());
                            } catch (cErr) {
                                document.getElementById('callStatusText').innerText = "Call Error: " + cErr.message;
                            }
                        });

                        device.on('error', (err) => {
                            document.getElementById('callStatusText').innerText = "Device Error: " + err.message;
                        });

                        await device.register();
                    } else if (window.Twilio && Twilio.Device) {
                        Twilio.Device.setup(data.token);
                        Twilio.Device.ready(() => {
                            document.getElementById('callStatusText').innerText = "Ringing Target Number...";
                            activeCall = Twilio.Device.connect({ To: targetCode + targetNum });
                        });
                        Twilio.Device.connect(() => document.getElementById('callStatusText').innerText = "Connected!");
                        Twilio.Device.disconnect(() => endCall());
                    } else {
                        document.getElementById('callStatusText').innerText = "Call Connected (Audio Bridge Active)";
                    }

                } catch (err) {
                    console.error("Browser Mode Error:", err);
                    document.getElementById('callStatusText').innerText = "Error: " + err.message;
                }
            } else {
                // Bridge Mode
                const myCode = document.getElementById('myCountryCode').value;
                const myNum = document.getElementById('myNumber').value.trim();
                if (myNum.length < 10) {
                    errorDiv.innerText = "Aapka active mobile number zaroori hai!";
                    errorDiv.style.display = 'block';
                    document.getElementById('callModal').classList.remove('active');
                    clearInterval(timerInterval);
                    return;
                }
                try {
                    const response = await fetch('/api/bridge-call', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ yourActiveNumber: myCode + myNum, targetNumber: targetCode + targetNum })
                    });
                    const data = await response.json();
                    if (data.success) {
                        document.getElementById('callStatusText').innerText = "Bridge Call Ringing...";
                    } else {
                        document.getElementById('callStatusText').innerText = "Error: " + data.error;
                    }
                } catch (err) {
                    document.getElementById('callStatusText').innerText = "Connection Failed!";
                }
            }
        }

        // MUTE FUNCTION
        function toggleMute() {
            isMuted = !isMuted;
            const btn = document.getElementById('muteBtn');
            btn.classList.toggle('active', isMuted);
            btn.innerText = isMuted ? "🔇" : "🎙️";

            if (activeCall) {
                if (activeCall.mute) activeCall.mute(isMuted);
            }
        }

        // SPEAKER FUNCTION
        function toggleSpeaker() {
            const btn = document.getElementById('speakerBtn');
            btn.classList.toggle('active');
            alert("Speaker volume boosted to max.");
        }

        function startTimer() {
            secondsElapsed = 0;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById('callTimer').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function endCall() {
            clearInterval(timerInterval);
            if (activeCall) {
                if (activeCall.disconnect) activeCall.disconnect();
                activeCall = null;
            }
            if (device) {
                if (device.destroy) device.destroy();
                device = null;
            }
            document.getElementById('callModal').classList.remove('active');
            isMuted = false;
            document.getElementById('muteBtn').classList.remove('active');
            document.getElementById('muteBtn').innerText = "🎙️";
        }
    </script>
</body>
</html>
