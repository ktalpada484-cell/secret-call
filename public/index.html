<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Call - Private Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #050b07; color: #00ff66; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(circle at 50% 20%, rgba(0, 255, 102, 0.08) 0%, transparent 50%);
        }
        .container { width: 100%; max-width: 420px; padding: 20px; }
        .glass-card {
            background: rgba(10, 25, 15, 0.65); backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 102, 0.2); border-radius: 24px; padding: 30px 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 255, 102, 0.1);
        }
        .header { text-align: center; margin-bottom: 25px; }
        .header .icon { font-size: 42px; margin-bottom: 10px; }
        .header h1 { color: #ffffff; font-size: 24px; font-weight: 700; letter-spacing: 1px; }
        .header p { color: #00cc55; font-size: 13px; }
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; color: #88bb99; font-size: 12px; text-transform: uppercase; margin-bottom: 8px; }
        .input-wrapper { display: flex; }
        .country-select {
            background: rgba(0, 20, 10, 0.8); border: 1px solid rgba(0, 255, 102, 0.3);
            color: #00ff66; padding: 14px 10px; border-radius: 12px 0 0 12px; outline: none; border-right: none;
        }
        .phone-input, .text-input {
            width: 100%; background: rgba(0, 20, 10, 0.8); border: 1px solid rgba(0, 255, 102, 0.3);
            color: #ffffff; padding: 14px 15px; font-size: 15px; outline: none;
        }
        .phone-input { border-radius: 0 12px 12px 0; }
        .text-input { border-radius: 12px; }
        .glass-btn {
            width: 100%; background: rgba(0, 255, 102, 0.15); border: 1px solid rgba(0, 255, 102, 0.5);
            color: #ffffff; padding: 16px; font-size: 16px; font-weight: 600; border-radius: 14px;
            cursor: pointer; backdrop-filter: blur(5px); transition: all 0.3s ease; margin-top: 10px;
        }
        .glass-btn:hover { background: rgba(0, 255, 102, 0.3); box-shadow: 0 0 20px rgba(0, 255, 102, 0.4); }
        .error-msg { color: #ff4444; font-size: 12px; text-align: center; margin-top: 10px; display: none; }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 8, 4, 0.95); display: flex; justify-content: center; align-items: center;
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .call-screen { text-align: center; width: 100%; max-width: 360px; padding: 30px; }
        .avatar-glow {
            width: 100px; height: 100px; border-radius: 50%; background: rgba(0, 255, 102, 0.1);
            border: 2px solid #00ff66; display: flex; justify-content: center; align-items: center;
            margin: 0 auto 20px auto; font-size: 40px; animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 102, 0.4); }
            70% { box-shadow: 0 0 0 25px rgba(0, 255, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 102, 0); }
        }
        .end-btn {
            background: rgba(255, 50, 50, 0.2); border: 1px solid #ff4444;
            color: #ff4444; width: 60px; height: 60px; border-radius: 50%;
            font-size: 24px; cursor: pointer; margin-top: 30px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div class="container" id="loginScreen">
        <div class="glass-card">
            <div class="header">
                <div class="icon">🔒</div>
                <h1>SECRET CALL</h1>
                <p>Private Portal</p>
            </div>
            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" class="text-input" placeholder="Enter username" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" class="text-input" placeholder="Enter password" required>
                </div>
                <button type="submit" class="glass-btn">🔓 Login</button>
                <div id="loginError" class="error-msg">Invalid Credentials!</div>
            </form>
        </div>
    </div>

    <!-- 2. MAIN DIALER SCREEN -->
    <div class="container hidden" id="dialerScreen">
        <div class="glass-card">
            <div class="header">
                <div class="icon">📞</div>
                <h1>SECRET CALL</h1>
                <p>Caller ID Masking Active</p>
            </div>

            <!-- YOUR NUMBER (The phone that picks up first) -->
            <div class="input-group">
                <label>Your Mobile Number (Aapka Phone)</label>
                <div class="input-wrapper">
                    <select class="country-select" id="myCountryCode">
                        <option value="+91" selected>🇮🇳 +91</option>
                    </select>
                    <input type="tel" id="myNumber" class="phone-input" placeholder="Aapka Number" maxlength="10">
                </div>
            </div>

            <!-- TARGET NUMBER (The recipient) -->
            <div class="input-group">
                <label>Target Phone Number (Samne Wala)</label>
                <div class="input-wrapper">
                    <select class="country-select" id="targetCountryCode">
                        <option value="+91" selected>🇮🇳 +91</option>
                    </select>
                    <input type="tel" id="targetNumber" class="phone-input" placeholder="Target Number" maxlength="10">
                </div>
            </div>

            <button class="glass-btn" onclick="initiateSecretCall()">🛡️ Connect Secret Call</button>
            <div id="dialerError" class="error-msg">Sahi 10-Digit Mobile Numbers Enter Karein!</div>
        </div>
    </div>

    <!-- 3. CALL STATUS MODAL -->
    <div class="modal-overlay" id="callModal">
        <div class="call-screen">
            <div class="avatar-glow">📞</div>
            <h2 style="color:#fff;">CONNECTING...</h2>
            <p style="color:#00ff66; margin-top:10px;" id="callStatusText">Pehle aapke phone par call aayegi, use uthaiye!</p>
            <button class="end-btn" onclick="endCall()">✕</button>
        </div>
    </div>

    <script>
        const VALID_USER = "sumit@1123";
        const VALID_PASS = "manali@11230";

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();

            if (u === VALID_USER && p === VALID_PASS) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dialerScreen').classList.remove('hidden');
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        async function initiateSecretCall() {
            const myCode = document.getElementById('myCountryCode').value;
            const myNum = document.getElementById('myNumber').value.trim();
            
            const targetCode = document.getElementById('targetCountryCode').value;
            const targetNum = document.getElementById('targetNumber').value.trim();
            
            const errorDiv = document.getElementById('dialerError');

            if (myNum.length < 10 || targetNum.length < 10) {
                errorDiv.style.display = 'block';
                return;
            }

            errorDiv.style.display = 'none';
            document.getElementById('callModal').classList.add('active');
            document.getElementById('callStatusText').innerText = "Ringing your phone... Pick up to connect to target!";

            try {
                const response = await fetch('/api/make-secret-call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        myNumber: myCode + myNum,
                        targetNumber: targetCode + targetNum
                    })
                });

                const data = await response.json();
                if (data.success) {
                    document.getElementById('callStatusText').innerText = "Call routed! Check your phone.";
                } else {
                    document.getElementById('callStatusText').innerText = "Error: " + data.error;
                }
            } catch (err) {
                document.getElementById('callStatusText').innerText = "Connection Failed!";
            }
        }

        function endCall() {
            document.getElementById('callModal').classList.remove('active');
        }
    </script>
</body>
</html>
