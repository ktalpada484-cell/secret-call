<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Call - Private Calling Portal</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050b07;
            color: #00ff66;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 255, 102, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 204, 82, 0.05) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .glass-card {
            background: rgba(10, 25, 15, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 102, 0.2);
            border-radius: 24px;
            padding: 30px 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 255, 102, 0.1);
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header .icon { font-size: 42px; margin-bottom: 10px; }
        .header h1 { color: #ffffff; font-size: 24px; font-weight: 700; }
        .header p { color: #00cc55; font-size: 13px; }

        .input-group { margin-bottom: 20px; }
        .input-group label {
            display: block;
            color: #88bb99;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .input-wrapper { display: flex; }

        .country-select {
            background: rgba(0, 20, 10, 0.8);
            border: 1px solid rgba(0, 255, 102, 0.3);
            color: #00ff66;
            padding: 14px 10px;
            border-radius: 12px 0 0 12px;
            outline: none;
            border-right: none;
        }

        .phone-input, .text-input {
            width: 100%;
            background: rgba(0, 20, 10, 0.8);
            border: 1px solid rgba(0, 255, 102, 0.3);
            color: #ffffff;
            padding: 14px 15px;
            font-size: 15px;
            outline: none;
        }

        .phone-input { border-radius: 0 12px 12px 0; }
        .text-input { border-radius: 12px; }

        .glass-btn {
            width: 100%;
            background: rgba(0, 255, 102, 0.15);
            border: 1px solid rgba(0, 255, 102, 0.5);
            color: #ffffff;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .glass-btn:hover {
            background: rgba(0, 255, 102, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
        }

        .error-msg { color: #ff4444; font-size: 12px; text-align: center; margin-top: 10px; display: none; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 8, 4, 0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .call-screen { text-align: center; width: 100%; max-width: 360px; padding: 30px; }

        .avatar-glow {
            width: 100px; height: 100px; border-radius: 50%;
            background: rgba(0, 255, 102, 0.1); border: 2px solid #00ff66;
            display: flex; justify-content: center; align-items: center;
            margin: 0 auto 20px auto; font-size: 40px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 102, 0.4); }
            70% { box-shadow: 0 0 0 25px rgba(0, 255, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 102, 0); }
        }

        .end-btn {
            background: rgba(255, 50, 50, 0.2); border: 1px solid #ff4444;
            color: #ff4444; width: 60px; height: 60px; border-radius: 50%;
            font-size: 24px; cursor: pointer; margin-top: 30px;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div class="container" id="loginScreen">
        <div class="glass-card">
            <div class="header">
                <div class="icon">🔒</div>
                <h1>SECRET CALL</h1>
                <p>Private Login</p>
            </div>
            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" class="text-input" placeholder="Enter username" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" class="text-input" placeholder="Enter password" required>
                </div>
                <button type="submit" class="glass-btn">🔓 Login</button>
                <div id="loginError" class="error-msg">Galat Username ya Password!</div>
            </form>
        </div>
    </div>

    <!-- DIALER SCREEN -->
    <div class="container hidden" id="dialerScreen">
        <div class="glass-card">
            <div class="header">
                <div class="icon">📞</div>
                <h1>SECRET CALL</h1>
                <p>Real-Time Encrypted Call</p>
            </div>
            <div class="input-group">
                <label>Target Channel Number</label>
                <div class="input-wrapper">
                    <select class="country-select" id="countryCode">
                        <option value="+91" selected>🇮🇳 +91</option>
                        <option value="+1">🇺🇸 +1</option>
                    </select>
                    <input type="tel" id="phoneNumber" class="phone-input" placeholder="9316481459" maxlength="10">
                </div>
            </div>
            <button class="glass-btn" onclick="startCall()">🛡️ Call Secretly</button>
            <div id="dialerError" class="error-msg">Valid 10-digit Number Dalein!</div>
        </div>
    </div>

    <!-- CALL MODAL -->
    <div class="modal-overlay" id="callModal">
        <div class="call-screen">
            <div class="avatar-glow">👤</div>
            <h2 style="color:#fff;" id="callerDisplayName">SECRET NUMBER</h2>
            <p style="color:#00ff66; margin-top:10px;" id="callStatus">Connecting Real-Time Audio...</p>
            <audio id="remoteAudio" autoplay></audio>
            <button class="end-btn" onclick="endCall()">✕</button>
        </div>
    </div>

    <script>
        const socket = io();
        let localStream;
        let peerConnection;
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            if (u === "sumit@1123" && p === "manali@11230") {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dialerScreen').classList.remove('hidden');
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        async function startCall() {
            const num = document.getElementById('phoneNumber').value.trim();
            if (num.length < 8) {
                document.getElementById('dialerError').style.display = 'block';
                return;
            }

            document.getElementById('callModal').classList.add('active');
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const room = "room-" + num;
                socket.emit('join-room', room);

                peerConnection = new RTCPeerConnection(config);
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                peerConnection.ontrack = (e) => {
                    document.getElementById('remoteAudio').srcObject = e.streams[0];
                    document.getElementById('callStatus').innerText = "Connected (Live Audio)";
                };

                peerConnection.onicecandidate = (e) => {
                    if (e.candidate) {
                        socket.emit('ice-candidate', { room, candidate: e.candidate });
                    }
                };

                socket.on('user-connected', async () => {
                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    socket.emit('offer', { room, offer });
                });

                socket.on('offer', async (offer) => {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    socket.emit('answer', { room, answer });
                });

                socket.on('answer', async (answer) => {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                });

                socket.on('ice-candidate', async (candidate) => {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
                });

            } catch (err) {
                document.getElementById('callStatus').innerText = "Microphone Access Denied!";
            }
        }

        function endCall() {
            if (peerConnection) peerConnection.close();
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            document.getElementById('callModal').classList.remove('active');
            window.location.reload();
        }
    </script>
</body>
</html>
